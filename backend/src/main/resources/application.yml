spring:
  application:
    name: sorveteria
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sorveteria?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:app_runtime}
    password: ${mysql_runtime_password:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      initialization-fail-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        name: SORV_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        path: /
  forward-headers-strategy: framework
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: never
  health:
    defaults:
      enabled: false
sorveteria:
  security:
    throttle-hmac-key: ${auth_throttle_hmac_key:}
    absolute-session-timeout: 12h
    temporary-password-lifetime: 24h
  installation:
    expected-schema-version: "8"

---
spring:
  config:
    activate:
      on-profile: cli
  main:
    web-application-type: none
server:
  port: -1

---
spring:
  config:
    activate:
      on-profile: development
server:
  servlet:
    session:
      cookie:
        secure: false

