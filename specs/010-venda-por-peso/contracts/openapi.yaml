openapi: 3.1.0
info:
  title: Sorvê - Venda por peso
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers: [{ url: / }]
security: [{ bearerAuth: [] }]
paths:
  /api/v1/products:
    post:
      operationId: createWeightedProduct
      summary: Cadastra produto vendido por unidade ou quilograma
      responses:
        '201': { description: Produto criado }
        '400': { description: Unidade ou dados inválidos }
  /api/v1/sales:
    post:
      operationId: checkoutWeightedSale
      summary: Conclui venda aceitando peso para produtos KG
      responses:
        '201': { description: Venda concluída }
        '400': { description: Quantidade incompatível com unidade }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
